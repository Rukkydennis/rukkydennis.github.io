<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="background-hearts">
        <span>💖</span><span>❤️</span><span>💘</span><span>💝</span><span>💓</span><span>💗</span><span>💖</span><span>❤️</span><span>💘</span><span>💝</span>
    </div>

    <div class="container">
        <div class="card">
            <h1 class="title">Will you be my Valentine?</h1>
            <div class="gif-container">
                <!-- Direct GIF image - No extra tooltips or branding -->
                <img src="https://media1.tenor.com/m/9Ev4_pF1p5MAAAAC/bh187-minions.gif" alt="Minions Begging"
                    class="minion-gif" id="mainGif">
            </div>
            <div class="buttons">
                <button id="yesBtn" class="btn yes-btn">Yes</button>
                <button id="noBtn" class="btn no-btn">No</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
